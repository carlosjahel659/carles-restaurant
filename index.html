<aside class="lateral" aria-label="Navegación principal">
  <div class="marca">
    <span class="logo">C</span>
    <div class="marca-tx"><b>Carles</b><span>Restaurant</span></div>
  </div>
  <nav class="nav" id="navLateral"></nav>
  <div class="lateral-pie" id="navLateralPie"></div>
</aside>

<div class="principal">
  <header class="top">
    <div class="top-marca"><span class="logo">C</span><b>Carles Restaurant</b></div>
    <div class="top-info" id="topInfo"></div>
    <div class="top-der">
      <button class="btn-ic campana" data-a="notif" aria-label="Alertas">
        <svg class="i" aria-hidden="true"><use href="#i-bell"/></svg><span class="ind" id="notifInd"></span>
      </button>
      <button class="usuario" data-a="config" id="btnUsuario" aria-label="Perfil y configuración"></button>
    </div>
  </header>
  <main id="vista"></main>
</div>

<nav class="inferior" id="navInferior" aria-label="Navegación"></nav>

<div class="popover" id="notif" role="dialog" aria-label="Alertas"></div>
<div class="velo" id="velo" data-a="cerrarPanel"></div>
<section class="cajon" id="cajon" role="dialog" aria-modal="true" aria-label="Detalle de mesa"></section>
<div class="capa" id="modal"></div>
<div class="capa" id="confirmar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
